name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  # Nix build on Linux — source of truth for correctness. Builds the QML
  # library, runs unit tests, and produces an .AppImage via
  # nix-bundle-appimage (same pattern as logos-basecamp/flake.nix's
  # bin-appimage output).
  storybook-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build design system QML library
        run: nix build --print-build-logs

      - name: Run unit tests
        run: nix build .#checks.x86_64-linux.tests --print-build-logs

      - name: Build storybook (nix)
        run: nix build .#storybook --print-build-logs

      - name: Build AppImage
        run: nix build .#bin-appimage --print-build-logs -o result-appimage

      - name: Stage AppImage for upload
        run: |
          mkdir -p out
          cp -L result-appimage/*.AppImage out/LogosStorybook-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogosStorybook-linux-x86_64.AppImage
          path: out/LogosStorybook-linux-x86_64.AppImage
          if-no-files-found: error

  # Nix build on macOS — validates the storybook builds cleanly on Darwin
  # and produces a .app bundle via nix-bundle-macos-app. Uses
  # DeterminateSystems installer because cachix/install-nix-action fails on
  # current macos-latest runners (same choice basecamp made).
  storybook-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v15
        with:
          name: logos-co
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build design system QML library
        run: nix build --print-build-logs

      - name: Run unit tests
        run: nix build ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).tests" --print-build-logs

      - name: Build storybook (nix)
        run: nix build .#storybook --print-build-logs

      - name: Build .app bundle
        run: nix build .#bin-macos-app --print-build-logs -o result

      - name: Package .app as tarball
        run: |
          # Mirrors logos-basecamp's approach: no codesigning in CI, ship
          # a plain tar.gz. Users extract via `tar -xzf` in Terminal, which
          # does NOT propagate the com.apple.quarantine attribute — so the
          # unsigned .app runs without Gatekeeper's "damaged" refusal.
          # (A .zip would auto-expand in Safari and DO propagate quarantine,
          # which is why zip + unsigned + Gatekeeper = "damaged" dialog.)
          #
          # `-maxdepth 1` goes before `-name` for BSD `find` (macOS) — BSD
          # rejects `-maxdepth` after other primaries. GNU find is lenient.
          app=$(find result/ -maxdepth 1 -name '*.app' -print -quit)
          tar -czf LogosStorybook-macos-unsigned.app.tar.gz \
            -C result "$(basename "$app")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogosStorybook-macos-unsigned.app.tar.gz
          path: LogosStorybook-macos-unsigned.app.tar.gz
          if-no-files-found: error

  # Windows build via plain CMake + Qt from install-qt-action. Nix isn't
  # an option on Windows, so this is the only path. Linux and macOS also
  # produce artifacts (AppImage and .app.tar.gz respectively) — see above.
  storybook-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLOGOS_DS_BUILD_STORYBOOK=ON
          -DLOGOS_DS_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target LogosStorybook

      - name: Build tests
        shell: bash
        run: cmake --build build --config Release --target LogosDesignSystemTests

      - name: Run unit tests
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = "stage\LogosStorybook"
          New-Item -ItemType Directory -Force -Path `
            "$stage\bin","$stage\lib\pages" | Out-Null

          $exe = Get-ChildItem -Path build -Recurse -Filter "LogosStorybook.exe" |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "LogosStorybook.exe not found under build\"
            Get-ChildItem -Path build -Recurse -Filter "*.exe" |
              ForEach-Object { Write-Host "  found: $($_.FullName)" }
            exit 1
          }
          Write-Host "Using $exe"
          Copy-Item $exe "$stage\bin\"

          # Pages QML stays loose so the storybook's HotReloader can watch it.
          # Logos.Theme/.Controls/.Icons are STATIC-linked into the binary,
          # so no build\storybook\qml directory to ship (and windeployqt only
          # scans the storybook dir — Logos.* is embedded, nothing to deploy).
          Copy-Item "storybook\pages\*.qml" "$stage\lib\pages\"

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --qmldir "storybook" `
            --release `
            --no-translations `
            "$stage\bin\LogosStorybook.exe"

          Compress-Archive -Path $stage -DestinationPath "LogosStorybook-windows-x86_64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogosStorybook-windows-x86_64.zip
          path: LogosStorybook-windows-x86_64.zip
          if-no-files-found: error

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: [storybook-linux, storybook-macos, storybook-windows]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post storybook build links on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: storybook-builds
          message: |
            ### Storybook CI builds

            Artifacts are available on the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts) (requires GitHub login).

            | Platform | How to get it |
            |----------|---------------|
            | Linux    | `LogosStorybook-linux-x86_64.AppImage` (uploaded artifact) |
            | macOS    | `LogosStorybook-macos-unsigned.app.tar.gz` (uploaded artifact) |
            | Windows  | `LogosStorybook-windows-x86_64.zip` (uploaded artifact) |

            **macOS**: extract via Terminal, not Finder, so `com.apple.quarantine` doesn't propagate to the `.app`:
            ```
            tar -xzf LogosStorybook-macos-unsigned.app.tar.gz
            open LogosStorybook.app
            ```
            First launch still shows *"cannot verify developer"* (no Apple Developer ID yet) — right-click → **Open** → **Open** once and macOS remembers.

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [storybook-linux, storybook-macos, storybook-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Rolling per-commit build of master. Recreated on every push so the
  # `canary` tag/release always points at HEAD. Marked as prerelease with
  # make_latest=false so real semver `v*` tags keep the "Latest" badge in
  # the sidebar. Stable download URL:
  #   https://github.com/<owner>/<repo>/releases/tag/canary
  canary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [storybook-linux, storybook-macos, storybook-windows]
    runs-on: ubuntu-latest
    concurrency:
      group: canary-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Delete the previous canary release + tag so the recreated one gets a
      # fresh "published at" timestamp. `|| true` because the very first run
      # has nothing to delete.
      - name: Remove previous canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete canary --yes --cleanup-tag \
            --repo "${{ github.repository }}" || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: canary
          name: Canary (master)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          body: |
            Rolling build from `master`. Recreated on every push — always
            reflects the current HEAD. Not a stable release; see the
            releases list for tagged `v*` versions.

            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}

            | Platform | File |
            |----------|------|
            | Linux    | `LogosStorybook-linux-x86_64.AppImage` |
            | macOS    | `LogosStorybook-macos-unsigned.app.tar.gz` |
            | Windows  | `LogosStorybook-windows-x86_64.zip` |

            macOS: extract via Terminal so quarantine doesn't propagate:
            ```
            tar -xzf LogosStorybook-macos-unsigned.app.tar.gz
            open LogosStorybook.app
            ```
          files: artifacts/*
          fail_on_unmatched_files: true
